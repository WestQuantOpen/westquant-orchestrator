[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="westquant-orchestrator"
version="0.1.0a1"
readme = "README.md"
description="Cross-framework orchestration, trace normalization, and evaluation for WestQuant Open"
requires-python=">=3.10"
license={text="Apache-2.0"}
dependencies=["westquant-core>=0.2.0a1"]

[project.scripts]
westquant-merge-traces="westquant_orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/WestQuantOpen"
Source = "https://github.com/WestQuantOpen/westquant-orchestrator"

[project.optional-dependencies]
test=["pytest>=8"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","../westquant-core/src"]
